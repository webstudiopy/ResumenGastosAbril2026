  <script>
    function agregarResumenAdelantos() {
      const categoria = window.APP_DATA.categorias.find(
        c => c.nombre === "Adelantos mes de abril"
      );

      if (!categoria) return;

      const totales = {};

      categoria.items.forEach(item => {
        let nombre = item[1]
          .replace("Vale", "")
          .split("/")[0]
          .trim();

        if (!totales[nombre]) {
          totales[nombre] = 0;
        }

        totales[nombre] += item[2];
      });

      const resumen = document.createElement("div");
      resumen.className = "resumen-adelantos";

      resumen.innerHTML = `
        <h4>Total de adelantos por persona</h4>
        ${Object.entries(totales).map(([persona, total]) => `
          <div class="resumen-item">
            <span>${persona}</span>
            <strong>${total.toLocaleString("es-PY")} Gs.</strong>
          </div>
        `).join("")}
      `;

      const cards = document.querySelectorAll("#cards > *");
      const cardAdelantos = Array.from(cards).find(card =>
        card.textContent.includes("Adelantos mes de abril")
      );

      if (cardAdelantos) {
        cardAdelantos.appendChild(resumen);
      }
    }

    window.addEventListener("load", agregarResumenAdelantos);
  </script>
